name: Deploy Backend to HF Spaces

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Fetch fine-tuned DistilBERT weights
        run: |
          mkdir -p backend/models/distilbert-cognitive-distortions-improved
          base="https://huggingface.co/shubhiu/reframe-distilbert-cognitive-distortions/resolve/main"
          cd backend/models/distilbert-cognitive-distortions-improved
          curl -sSL -f -o config.json "$base/config.json"
          curl -sSL -f -o model.safetensors "$base/model.safetensors"
          curl -sSL -f -o tokenizer.json "$base/tokenizer.json"
          curl -sSL -f -o tokenizer_config.json "$base/tokenizer_config.json"

      - name: Push backend to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ci@github"
          git config --global user.name "GitHub Actions"
          git lfs install
          cd backend
          git init -b main
          git lfs track "*.pkl" "*.safetensors"
          git add .
          git commit -m "Deploy from GitHub Actions"
          git push --force https://shubhiu:$HF_TOKEN@huggingface.co/spaces/shubhiu/reframe-backend main
